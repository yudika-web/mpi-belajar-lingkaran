<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ekspedisi Planet Lingkaran</title>
  <style>
    :root{
      --navy:#16213E;
      --navy2:#0E1630;
      --blue:#39A7FF;
      --purple:#7B61FF;
      --yellow:#FFD166;
      --white:#F8FBFF;
      --card:#FFFFFF;
      --text:#182033;
      --muted:#65728A;
      --ok:#2EAD6B;
      --bad:#D94B5B;
      --soft:#EDF5FF;
      --border:#D8E6F7;
      --shadow:0 10px 30px rgba(10,27,62,.12);
      --radius:22px;
      --header-h:78px;
      --nav-h:78px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      height:100%;
      overflow:hidden;
      font-family:Inter,Poppins,"Segoe UI",Arial,sans-serif;
      background:linear-gradient(160deg,var(--navy2),var(--navy));
      color:var(--text);
    }
    button,input,select{font:inherit}
    button{touch-action:manipulation}
    .app{
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }
    .stars::before,.stars::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 15%, rgba(255,255,255,.45) 0 1.2px, transparent 2px),
        radial-gradient(circle at 35% 60%, rgba(255,255,255,.35) 0 1px, transparent 2px),
        radial-gradient(circle at 90% 70%, rgba(255,255,255,.45) 0 1.2px, transparent 2px),
        radial-gradient(circle at 55% 85%, rgba(255,255,255,.35) 0 1px, transparent 2px);
      background-size:220px 220px;
      opacity:.45;
    }
    .app-header{
      min-height:var(--header-h);
      background:rgba(14,22,48,.94);
      color:white;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      border-bottom:1px solid rgba(255,255,255,.12);
      z-index:20;
      flex:0 0 auto;
    }
    .header-icon{
      width:46px;height:46px;border-radius:50%;
      display:grid;place-items:center;
      background:linear-gradient(145deg,var(--purple),var(--blue));
      box-shadow:0 6px 20px rgba(57,167,255,.25);
      font-size:24px;
      flex:0 0 auto;
    }
    .header-main{min-width:0;flex:1}
    .header-title{
      font-size:clamp(16px,2.4vw,22px);
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .header-meta{
      margin-top:3px;
      font-size:12px;
      color:#C9D7F1;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    #headerCloud{
      color:#BFE0FF;
      white-space:nowrap;
    }
    .header-progress{
      width:min(170px,28vw);
      min-width:90px;
    }
    .progress-track{
      width:100%;height:9px;border-radius:99px;
      background:rgba(255,255,255,.17);
      overflow:hidden;
    }
    .progress-fill{
      height:100%;width:0%;
      background:linear-gradient(90deg,var(--yellow),#FFE7A7);
      border-radius:99px;
      transition:width .25s ease;
    }
    .content-wrap{
      flex:1;
      min-height:0;
      position:relative;
      z-index:2;
    }
    .content-scroll{
      height:100%;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:20px 16px calc(var(--nav-h) + 42px);
      scroll-behavior:smooth;
    }
    .content-scroll.no-nav{padding-bottom:20px}
    .page{
      width:min(980px,100%);
      margin:0 auto;
      animation:fadeUp .22s ease;
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1;transform:translateY(0)}
    }
    .hero{
      color:white;
      text-align:center;
      padding:16px 0 8px;
    }
    .hero h1{
      font-size:clamp(30px,7vw,56px);
      line-height:1.04;
      margin:10px 0 10px;
    }
    .hero p{
      margin:0 auto;
      max-width:680px;
      color:#DCE8FF;
      font-size:clamp(15px,2vw,19px);
      line-height:1.55;
    }
    .planet-logo{
      width:118px;height:118px;margin:4px auto 8px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%,#B8E4FF 0 5%,transparent 6%),
        radial-gradient(circle at 64% 60%,rgba(255,255,255,.38) 0 9%,transparent 10%),
        linear-gradient(145deg,#7B61FF,#39A7FF);
      box-shadow:
        0 0 0 14px rgba(123,97,255,.11),
        0 0 50px rgba(57,167,255,.25);
      position:relative;
      display:grid;
      place-items:center;
      font-size:48px;
    }
    .planet-logo::after{
      content:"";
      position:absolute;
      width:150px;height:38px;
      border:5px solid rgba(255,209,102,.85);
      border-radius:50%;
      transform:rotate(-16deg);
    }
    .card{
      background:var(--card);
      border:1px solid rgba(216,230,247,.9);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      margin-bottom:14px;
    }
    .card-title{
      margin:0 0 10px;
      font-size:clamp(19px,2.4vw,25px);
      color:var(--navy);
      font-weight:800;
    }
    .subtle{color:var(--muted);line-height:1.55}
    .field{margin:14px 0}
    label{display:block;font-weight:800;margin-bottom:7px;color:var(--navy)}
    input[type="text"],input[type="number"],select{
      width:100%;
      min-height:52px;
      border:2px solid var(--border);
      border-radius:15px;
      padding:12px 14px;
      background:#FBFDFF;
      color:var(--text);
      outline:none;
    }
    input:focus,select:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(57,167,255,.12);
    }
    .btn{
      border:none;
      border-radius:16px;
      min-height:52px;
      padding:12px 18px;
      font-weight:800;
      cursor:pointer;
      transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-align:center;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(1px)}
    .btn:focus-visible{outline:4px solid rgba(255,209,102,.7);outline-offset:2px}
    .btn.primary{
      color:white;background:linear-gradient(135deg,var(--blue),#258EE5);
      box-shadow:0 8px 20px rgba(57,167,255,.25);
    }
    .btn.purple{
      color:white;background:linear-gradient(135deg,var(--purple),#6248E6);
    }
    .btn.yellow{
      color:#392D00;background:var(--yellow);
    }
    .btn.ghost{
      background:#F3F7FD;color:var(--navy);border:1px solid var(--border);
    }
    .btn.danger{
      background:#FFF0F2;color:#A52837;border:1px solid #F4C6CD;
    }
    .btn[disabled]{opacity:.48;cursor:not-allowed;transform:none!important;box-shadow:none}
    .btn.block{width:100%}
    .notice{
      border-radius:15px;
      padding:12px 14px;
      margin-top:12px;
      line-height:1.45;
      font-weight:700;
    }
    .notice.warn{background:#FFF7D8;color:#765A00;border:1px solid #FFE59A}
    .notice.ok{background:#EAF8F0;color:#17683F;border:1px solid #BDE9D0}
    .notice.bad{background:#FFF0F2;color:#8E2936;border:1px solid #F4C6CD}
    .notice.info{background:#EEF6FF;color:#225D94;border:1px solid #CDE3FB}
    .menu-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .menu-card{
      background:white;
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px;
      min-height:132px;
      cursor:pointer;
      box-shadow:var(--shadow);
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .menu-card:hover{transform:translateY(-1px)}
    .menu-card .icon{font-size:34px}
    .menu-card h3{margin:10px 0 4px;color:var(--navy);font-size:18px}
    .menu-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
    .badge{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 10px;
      border-radius:999px;
      background:#EEF6FF;
      color:#265F93;
      font-size:12px;
      font-weight:800;
    }
    .badge.done{background:#EAF8F0;color:#17683F}
    .bottom-nav{
      position:fixed;
      left:0;right:0;bottom:0;
      min-height:var(--nav-h);
      background:rgba(255,255,255,.97);
      border-top:1px solid #D8E6F7;
      box-shadow:0 -8px 28px rgba(16,32,64,.12);
      z-index:9999;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    }
    .bottom-nav.hidden{display:none}
    .nav-btn{
      min-height:54px;
      border:none;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
      background:#EEF5FD;
      color:var(--navy);
    }
    .nav-btn.next{background:var(--blue);color:white}
    .nav-btn:disabled{opacity:.4;cursor:not-allowed}
    .section-title{
      color:white;
      margin:0 0 14px;
      font-size:clamp(24px,4vw,36px);
      font-weight:900;
    }
    .section-sub{
      color:#D7E6FF;
      margin:-6px 0 16px;
      line-height:1.5;
    }
    .target-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }
    .target-card{
      background:white;
      border-radius:20px;
      padding:16px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }
    .target-card .big{font-size:34px}
    .target-card h3{margin:8px 0 6px;color:var(--navy)}
    .formula{
      font-size:clamp(25px,5vw,42px);
      font-weight:900;
      text-align:center;
      color:var(--purple);
      background:#F4F1FF;
      border:1px solid #DFD7FF;
      border-radius:18px;
      padding:16px;
      margin:12px 0;
    }
    .stepper{
      display:grid;
      gap:10px;
      margin-top:12px;
    }
    .step{
      border-left:5px solid var(--blue);
      background:#F6FAFF;
      border-radius:14px;
      padding:12px 14px;
    }
    .step b{color:var(--navy)}
    .circle-diagram{
      width:min(300px,78vw);
      aspect-ratio:1;
      border-radius:50%;
      margin:14px auto;
      background:radial-gradient(circle at center,#fff 0 4px,transparent 5px),linear-gradient(145deg,#E8F4FF,#CFE9FF);
      border:6px solid var(--blue);
      position:relative;
      box-shadow:0 8px 24px rgba(57,167,255,.18);
      overflow:visible;
    }
    .center-dot{
      width:14px;height:14px;border-radius:50%;background:var(--purple);
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    }
    .radius-line,.diameter-line{
      position:absolute;left:50%;top:50%;
      transform-origin:left center;
      height:4px;background:var(--purple);border-radius:99px;
    }
    .radius-line{width:42%;transform:rotate(-25deg)}
    .diameter-line{width:92%;transform:translateX(-50%) rotate(0deg);left:50%;background:var(--yellow)}
    .hotspots{
      display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px
    }
    .hotspot-btn{
      border:1px solid var(--border);
      background:white;
      color:var(--navy);
      border-radius:999px;
      padding:9px 12px;
      font-weight:800;
      cursor:pointer;
    }
    .hotspot-btn.active{background:var(--purple);color:white;border-color:var(--purple)}
    .diagram-block{
      width:min(330px,84vw);
      margin:14px auto;
    }
    .circle-visual{
      width:100%;
      aspect-ratio:1 / 1;
      border-radius:0;
      border:none;
      background:transparent;
      box-shadow:none;
      margin:0 auto;
      padding:0;
      overflow:visible;
    }
    .circle-svg{width:100%;height:auto;display:block}
    .circle-svg .base-circle{fill:#E8F4FF;stroke:var(--blue);stroke-width:8}
    .circle-svg .svg-juring{
      fill:rgba(255,209,102,.20);
      stroke:rgba(255,209,102,.55);
      stroke-width:3;
      opacity:.22;
      transition:opacity .2s ease,transform .2s ease;
      transform-origin:150px 150px;
    }
    .circle-svg .svg-busur,
    .circle-svg .svg-jari,
    .circle-svg .svg-diameter,
    .circle-svg .svg-pusat{
      opacity:.22;
      transition:opacity .2s ease,transform .2s ease,stroke-width .2s ease,fill .2s ease;
    }
    .circle-svg .svg-jari{
      stroke:var(--purple);
      stroke-width:8;
      stroke-linecap:round;
      fill:none;
    }
    .circle-svg .svg-diameter{
      stroke:var(--yellow);
      stroke-width:8;
      stroke-linecap:round;
      fill:none;
    }
    .circle-svg .svg-busur{
      stroke:#FF8A5B;
      stroke-width:10;
      stroke-linecap:round;
      fill:none;
    }
    .circle-svg .svg-pusat{
      fill:var(--purple);
      stroke:white;
      stroke-width:4;
    }
    .circle-svg .active{
      opacity:1 !important;
      filter:url(#glow);
    }
    .circle-svg .svg-juring.active{
      fill:rgba(255,209,102,.55);
      stroke:#E5A500;
      stroke-width:4;
      transform:scale(1.01);
    }
    .circle-svg .svg-jari.active,
    .circle-svg .svg-diameter.active,
    .circle-svg .svg-busur.active{
      stroke-width:11;
    }
    .circle-svg .svg-pusat.active{
      r:11;
      fill:#7B61FF;
    }
    .circle-svg text{
      font-family:Inter,Poppins,"Segoe UI",Arial,sans-serif;
      font-weight:800;
      fill:#173056;
    }
    .diagram-caption{
      text-align:center;
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }
    .circle-svg .callout-arrow{
      stroke:#FF8A5B;
      stroke-width:4;
      stroke-linecap:round;
      stroke-dasharray:8 7;
      fill:none;
      animation:dashMove 1s linear infinite;
    }
    .circle-svg .callout-dot{
      fill:#FF8A5B;
      animation:pulseDot 1.1s ease-in-out infinite;
    }
    .circle-svg .callout-bubble{
      fill:rgba(255,255,255,.96);
      stroke:#FFBE7C;
      stroke-width:2.5;
      rx:16;
      ry:16;
      filter:url(#glowSoft);
    }
    .circle-svg .callout-title{
      font-size:14px;
      font-weight:900;
      fill:#12365F;
    }
    .circle-svg .callout-sub{
      font-size:11.5px;
      font-weight:700;
      fill:#4B6281;
    }
    .circle-svg .point-badge{
      fill:white;
      stroke:#7B61FF;
      stroke-width:2.5;
    }
    .circle-svg .point-label{
      font-size:14px;
      font-weight:900;
      fill:#21395B;
      text-anchor:middle;
      dominant-baseline:middle;
    }
    .point-legend{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:10px;
    }
    .point-legend .badge{
      background:#F6FAFF;
      border:1px solid var(--border);
      color:var(--navy);
    }
    .match-activity{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:14px;
    }
    .match-chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .match-chip{
      border:2px dashed #BFD6F5;
      background:#FFFFFF;
      color:var(--navy);
      border-radius:999px;
      padding:10px 14px;
      font-weight:800;
      cursor:grab;
      user-select:none;
    }
    .match-chip.selected{
      background:#F4F1FF;
      border-color:var(--purple);
      color:var(--purple);
      box-shadow:0 0 0 4px rgba(123,97,255,.10);
    }
    .match-chip.done{
      background:#EAF8F0;
      border-style:solid;
      border-color:#BDE9D0;
      color:#17683F;
      cursor:default;
    }
    .match-board{
      background:#F8FBFF;
      border:1px solid var(--border);
      border-radius:20px;
      padding:12px;
    }
    .match-board-wrap{
      position:relative;
      width:min(330px,84vw);
      margin:0 auto;
    }
    .match-board-wrap .diagram-block{
      width:100%;
      margin:0 auto;
    }
    .match-target{
      position:absolute;
      width:54px;
      height:54px;
      border-radius:50%;
      border:2px dashed #7B61FF;
      background:rgba(255,255,255,.88);
      color:#7B61FF;
      font-weight:900;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition:transform .15s ease,background .15s ease,border-color .15s ease;
    }
    .match-target:hover{transform:scale(1.03)}
    .match-target.ready{
      border-style:solid;
      background:#F4F1FF;
    }
    .match-target.matched{
      width:auto;
      min-width:78px;
      height:38px;
      border-radius:999px;
      padding:0 10px;
      background:#EAF8F0;
      border:2px solid #BDE9D0;
      color:#17683F;
      font-size:12px;
    }
    .match-target small{
      font-size:10px;
      line-height:1.1;
      text-align:center;
      display:block;
    }
    .drag-tip{
      margin-top:6px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }
    @keyframes dashMove{
      from{stroke-dashoffset:0}
      to{stroke-dashoffset:-30}
    }
    @keyframes pulseDot{
      0%,100%{transform:scale(1); opacity:1}
      50%{transform:scale(1.15); opacity:.82}
    }
    .orbit-demo{
      width:min(320px,80vw);
      aspect-ratio:1;
      margin:10px auto;
      border:5px solid var(--blue);
      border-radius:50%;
      position:relative;
      background:radial-gradient(circle,#E9F5FF 0 58%,#D7ECFF 59% 100%);
    }
    .orbit-demo.spin::after{
      content:"🚀";
      position:absolute;
      font-size:30px;
      left:50%;top:-16px;
      transform:translateX(-50%);
      animation:orbitSpin 1.5s linear 1;
      transform-origin:0 calc(50% + 158px);
    }
    @keyframes orbitSpin{
      from{transform:translateX(-50%) rotate(0deg)}
      to{transform:translateX(-50%) rotate(360deg)}
    }
    .choice-list{display:grid;gap:10px;margin-top:12px}
    .choice{
      width:100%;
      text-align:left;
      border:2px solid var(--border);
      background:white;
      color:var(--text);
      border-radius:15px;
      padding:13px 14px;
      cursor:pointer;
      font-weight:700;
    }
    .choice.selected{border-color:var(--purple);background:#F4F1FF}
    .choice.correct{border-color:var(--ok);background:#EAF8F0}
    .choice.wrong{border-color:var(--bad);background:#FFF0F2}
    .hint-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .slider-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;align-items:center;margin:12px 0
    }
    input[type="range"]{width:100%}
    .stat-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .stat{
      background:#F6FAFF;
      border:1px solid var(--border);
      border-radius:15px;
      padding:12px;
    }
    .stat small{display:block;color:var(--muted)}
    .stat strong{display:block;color:var(--navy);font-size:22px;margin-top:4px}
    .quiz-head{
      display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px
    }
    .quiz-progress{
      flex:1;height:10px;background:#E8EEF7;border-radius:99px;overflow:hidden
    }
    .quiz-progress > div{
      height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));width:0%
    }
    .match-grid{
      display:grid;gap:10px
    }
    .match-row{
      display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:center
    }
    .order-list{display:grid;gap:8px}
    .order-row{
      display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:center
    }
    .order-row select{min-height:46px;padding:8px}
    .result-score{
      font-size:clamp(54px,12vw,92px);
      font-weight:900;color:var(--purple);
      text-align:center;line-height:1
    }
    .result-cat{
      text-align:center;
      font-weight:900;
      font-size:clamp(20px,4vw,30px);
      color:var(--navy);
      margin:8px 0 16px;
    }
    .fuel{
      height:26px;border-radius:99px;background:#E8EEF7;overflow:hidden;border:1px solid #D9E5F4
    }
    .fuel > div{
      height:100%;width:0%;
      background:linear-gradient(90deg,#FFD166,#FFB84D);
      transition:width .25s ease;
    }
    .sector-wrap{
      display:grid;place-items:center;margin:14px 0;
    }
    .sector{
      width:220px;height:220px;border-radius:50%;

<script>
(() => {
  "use strict";

  // ===============================
  // STATE & LOCAL STORAGE
  // ===============================
  const STORAGE_KEY = "mpi_lingkaran_v1";

  const defaultState = {
    namaSiswa: "",
    kelasSiswa: "",
    identitasValid: false,
    screen: "pembuka",
    sub: 0,
    materiSelesai: {
      keliling:false,
      luas:false,
      busur:false,
      sudut:false,
      juring:false
    },
    visited: {},
    quizAnswers: {},
    quizIndex: 0,
    evaluasiSelesai: false,
    nilaiAkhir: 0,
    kategoriHasil: "",
    evaluationAttemptId: "",
    evaluationSyncedAt: null,
    lastSavedAt: null
  };

  let state = loadState();
  let transient = {
    introConfirmed:false,
    materialHotspot:null,
    materialMatchSelected:null,
    materialMatched:{},
    materialMatchFeedback:"",
    evalLockNotice:false,
    lessonStepCount:0,
    practiceFeedback:"",
    practiceAnswered:false,
    hintLevel:0,
    simRadius:8,
    simAngle:90,
    sectorAngle:90,
    fuel:0,
    fuelIndex:0
  };

  // ===============================
  // SUPABASE CLOUD SYNC
  // ===============================
  let sbClient = null;
  let cloudUser = null;
  let cloudReady = false;
  let cloudSyncTimer = null;
  let cloudStatus = "connecting";

  function setCloudStatus(status, text){
    cloudStatus = status;
    const el = document.getElementById("headerCloud");
    if(!el) return;
    const labels = {
      connecting: "☁️ Menyambungkan…",
      online: "☁️ Tersinkron",
      syncing: "☁️ Menyimpan…",
      offline: "☁️ Offline — cache lokal",
      config: "☁️ Supabase belum dikonfigurasi",
      error: "☁️ Sinkronisasi bermasalah"
    };
    el.textContent = text || labels[status] || labels.connecting;
  }

  function isSupabaseConfigured(){
    const cfg = window.SUPABASE_CONFIG || {};
    return !!(
      cfg.url &&
      cfg.key &&
      !String(cfg.url).includes("YOUR_PROJECT") &&
      !String(cfg.key).includes("YOUR_")
    );
  }

  function newUuid(){
    if(globalThis.crypto && typeof globalThis.crypto.randomUUID === "function"){
      return globalThis.crypto.randomUUID();
    }
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function saveStateLocalOnly(){
    state.lastSavedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function scheduleCloudSync(){
    if(!cloudReady || !state.identitasValid || !navigator.onLine) return;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(() => {
      pushCloudState().catch(err => {
        console.error("Cloud sync error:", err);
        setCloudStatus("error");
      });
    }, 700);
  }

  async function ensureAnonymousSession(){
    const { data: sessionData, error: sessionError } = await sbClient.auth.getSession();
    if(sessionError) throw sessionError;

    let session = sessionData.session;
    if(!session){
      const { data, error } = await sbClient.auth.signInAnonymously();
      if(error) throw error;
      session = data.session;
    }

    const { data: userData, error: userError } = await sbClient.auth.getUser();
    if(userError) throw userError;
    cloudUser = userData.user;
    return session;
  }

  async function pullCloudState(){
    if(!cloudReady || !cloudUser) return;

    const { data, error } = await sbClient
      .from("student_state")
      .select("app_state, updated_at")
      .eq("user_id", cloudUser.id)
      .maybeSingle();

    if(error) throw error;

    if(!data){
      if(state.identitasValid) await pushCloudState(true);
      return;
    }

    const remoteTime = Date.parse(data.updated_at || "") || 0;
    const localTime = Date.parse(state.lastSavedAt || "") || 0;

    if(remoteTime > localTime && data.app_state){
      state = {
        ...defaultState,
        ...data.app_state,
        materiSelesai:{
          ...defaultState.materiSelesai,
          ...(data.app_state.materiSelesai || {})
        }
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    } else if(localTime > remoteTime && state.identitasValid){
      await pushCloudState(true);
    }
  }

  async function pushCloudState(immediate=false){
    if(!cloudReady || !cloudUser || !state.identitasValid || !navigator.onLine) return;
    if(!immediate) setCloudStatus("syncing");

    const payload = {
      user_id: cloudUser.id,
      student_name: state.namaSiswa,
      class_name: state.kelasSiswa,
      app_state: state
    };

    const { error } = await sbClient
      .from("student_state")
      .upsert(payload, { onConflict:"user_id" });

    if(error) throw error;
    setCloudStatus("online");

    if(state.evaluasiSelesai){
      await syncEvaluationResult();
    }
  }

  async function syncEvaluationResult(){
    if(!cloudReady || !cloudUser || !state.evaluasiSelesai || !navigator.onLine) return;

    if(!state.evaluationAttemptId){
      state.evaluationAttemptId = newUuid();
      saveStateLocalOnly();
    }

    const payload = {
      attempt_id: state.evaluationAttemptId,
      user_id: cloudUser.id,
      student_name: state.namaSiswa,
      class_name: state.kelasSiswa,
      score: state.nilaiAkhir,
      category: state.kategoriHasil,
      answers: state.quizAnswers || {}
    };

    const { error } = await sbClient
      .from("evaluation_results")
      .upsert(payload, { onConflict:"attempt_id" });

    if(error) throw error;

    state.evaluationSyncedAt = new Date().toISOString();
    saveStateLocalOnly();
    setCloudStatus("online");
  }

  async function startFreshCloudIdentity(){

      cloudReady = true;
      setCloudStatus("online");

      setCloudStatus("error");
    }
  }

  async function initSupabase(){
    if(!isSupabaseConfigured()){
      setCloudStatus("config");
      return;
    }

    try{
      const cfg = window.SUPABASE_CONFIG;
      sbClient = window.supabase.createClient(cfg.url, cfg.key, {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      });

      setCloudStatus("connecting");
      await ensureAnonymousSession();
      cloudReady = true;
      setCloudStatus(navigator.onLine ? "online" : "offline");

      if(navigator.onLine){
        await pullCloudState();
        if(state.evaluasiSelesai) await syncEvaluationResult();
      }
    }catch(err){
      console.error("Supabase init error:", err);
      setCloudStatus("error");
    }
  }

    return Number.isFinite(parsed) ? parsed : NaN;

    return Number.isFinite(a) && Math.abs(a-b) <= tol;

        <div class="menu-grid">

          ${menuCard("🎯","Tujuan Pembelajaran","Lihat target yang akan dikuasai.","tujuan",!!state.visited.tujuan)}

          ${p===5
            ? menuCard("📝","Evaluasi",state.evaluasiSelesai?`Nilai terakhir: ${state.nilaiAkhir}`:"Semua planet selesai. Evaluasi sudah terbuka.","evaluasi",state.evaluasiSelesai)
            : lockedMenuCard("🔒","Evaluasi",`Terkunci. Selesaikan ${5-p} planet lagi untuk membuka evaluasi.`)
          }
          ${menuCard("🎮","Simulator Orbit","Eksperimen jari-jari, busur, dan juring.","simulasi",!!state.visited.simulasi)}
        </div>

        <section class="card" style="margin-top:14px">
          <h3 class="card-title">🌍 Gerbang Planet Pembelajaran</h3>
          <p class="subtle">Planet terbuka secara bertahap. Kamu dapat mengulang planet yang sudah selesai kapan saja, lalu melanjutkan ke planet berikutnya tanpa harus kembali ke Planet 1.</p>
          <div class="planet-selector-grid">
            ${planetMeta.map((meta, idx) => {
              const unlocked = isPlanetUnlocked(meta.key);
              const done = !!state.materiSelesai[meta.key];
              const startIndex = getPlanetStartIndex(meta.key);
              const statusText = done ? "✅ Selesai" : (unlocked ? "🟢 Terbuka" : "🔒 Terkunci");
              const statusClass = done ? "done" : (unlocked ? "open" : "locked");
              const actionText = done ? "ULANGI PLANET" : (unlocked ? "MASUK PLANET" : "TERKUNCI");

    document.querySelectorAll("[data-screen]").forEach(btn=>{

        }else{

        }
      });
    });

      btn.addEventListener("click",()=>{
        const key = btn.dataset.planetKey;
        if(!isPlanetUnlocked(key) && !state.materiSelesai[key]) return;
        go("belajar", getPlanetStartIndex(key));
      });
    });

          <div class="icon">${icon}</div>
          <h3>${title}</h3>
          <p>${desc}</p>
        </div>
        <div><span class="badge">🔒 Terkunci</span></div>

  // ===============================
  // MATERIAL
  // ===============================
  function renderMaterial(){
    const idx = Math.max(0,Math.min(state.sub,materialPages.length-1));
    setHeader(`Materi: ${materialPages[idx]}`,`${idx+1}/${materialPages.length}`);
    markVisited("materi");
    let body = "";

    if(idx===0){
      body = `
        <section class="card">
          <h2 class="card-title">Kenalan dengan Lingkaran</h2>
          <p class="subtle">Sentuh tombol di bawah gambar untuk mengenali bagian-bagian lingkaran. Bagian yang dipilih akan <b>menyala</b>, diberi <b>panah animasi</b>, dan muncul penjelasan singkat.</p>
          ${hotspotDiagram(transient.materialHotspot)}
          <div class="hotspots">
            ${["pusat","jari","diameter","busur","juring"].map(k=>`<button class="hotspot-btn ${transient.materialHotspot===k?"active":""}" data-hotspot="${k}">${({pusat:"Titik Pusat",jari:"Jari-jari",diameter:"Diameter",busur:"Busur",juring:"Juring"})[k]}</button>`).join("")}
          </div>
          <div id="hotspotInfo" class="notice info" style="margin-top:14px">
            ${hotspotText(transient.materialHotspot)}
          </div>
        </section>

        ${renderMatchActivity()}
      `;
    } else if(idx===1){
      body = `
        <section class="card">
          <h2 class="card-title">Jari-jari dan Diameter</h2>
          <div class="formula">d = 2 × r</div>
          <div class="formula">r = d ÷ 2</div>
          <div class="stepper">
            <div class="step"><b>Diketahui:</b> diameter = 14 cm</div>
            <div class="step"><b>Hitung:</b> r = 14 ÷ 2</div>
            <div class="step"><b>Hasil:</b> r = 7,00 cm</div>
          </div>
          <h3 style="color:var(--navy);margin-top:18px">Latihan mikro</h3>
          <p>Jika diameter 20 cm, berapa jari-jarinya?</p>
          <div class="choice-list" id="microChoices">
            ${["5,00 cm","10,00 cm","20,00 cm","40,00 cm"].map((o,i)=>`<button class="choice" data-micro="${i}">${o}</button>`).join("")}
          </div>
          <div id="microFeedback"></div>
        </section>
      `;
    } else if(idx===2){
      body = `
        <section class="card">
          <h2 class="card-title">Mengenal π</h2>
          <p class="subtle"><b>π dibaca “pi”.</b> Pi digunakan untuk menghitung ukuran-ukuran pada lingkaran.</p>
          <div class="formula">π ≈ 3,14</div>
          <div class="formula">π ≈ 22/7</div>
          <div class="notice info">Pada setiap soal di MPI ini, nilai π yang harus digunakan akan diberikan. Kamu tidak perlu menebak.</div>
        </section>
      `;
    } else {
      const names = ["Keliling","Luas","Panjang Busur","Sudut Lingkaran","Luas Juring"];
      body = `
        <section class="card">
          <h2 class="card-title">Peta Lima Planet</h2>
          <p class="subtle">Setiap planet memuat konsep yang saling terhubung.</p>
          <div class="planet-path" style="margin-top:14px">
            ${names.map((n,i)=>`
              <div class="planet-stop">
                <div class="planet-dot p${i+1}">${["🌐","🪐","☄️","🛰️","🌙"][i]}</div>
                <div>
                  <b style="color:var(--navy)">Planet ${i+1}: ${n}</b>
                  <div class="tiny">${i===0?"Mulai dari panjang tepi.":i===1?"Lanjut ke daerah di dalam lingkaran.":i===2?"Pelajari sebagian keliling.":i===3?"Hubungkan sudut pusat dan keliling.":"Pelajari sebagian luas lingkaran."}</div>
                </div>
                <span class="badge ${state.materiSelesai[["keliling","luas","busur","sudut","juring"][i]]?"done":""}">
                  ${state.materiSelesai[["keliling","luas","busur","sudut","juring"][i]]?"✅":"○"}
                </span>
              </div>`).join("")}
          </div>
        </section>
      `;
    }

    content.innerHTML = `
      <div class="page">
        <h1 class="section-title">🪐 Materi Pembelajaran</h1>
        <p class="section-sub">Bagian ${idx+1} dari ${materialPages.length}</p>
        ${body}
      </div>
    `;

    document.querySelectorAll("[data-hotspot]").forEach(b=>{
      b.addEventListener("click",()=>{
        transient.materialHotspot = b.dataset.hotspot;
        renderMaterial();
      });
    });

    document.querySelectorAll("[data-micro]").forEach(b=>{
      b.addEventListener("click",()=>{
        const i = +b.dataset.micro;
        document.querySelectorAll("[data-micro]").forEach(x=>x.classList.remove("selected","correct","wrong"));
        b.classList.add(i===1?"correct":"wrong");
        document.getElementById("microFeedback").innerHTML = i===1
          ? `<div class="notice ok">✅ Benar. Jari-jari adalah setengah dari diameter: 20 ÷ 2 = 10,00 cm.</div>`
          : `<div class="notice bad">⚠️ Belum tepat. Diameter harus dibagi dua untuk memperoleh jari-jari.</div>`;
      });
    });

    document.querySelectorAll("[data-match-label]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const key = btn.dataset.matchLabel;
        if(transient.materialMatched[key]) return;
        transient.materialMatchSelected = transient.materialMatchSelected === key ? null : key;
        renderMaterial();
      });
      btn.addEventListener("dragstart",(e)=>{
        const key = btn.dataset.matchLabel;
        if(transient.materialMatched[key]) return e.preventDefault();
        e.dataTransfer.setData("text/plain", key);
        transient.materialMatchSelected = key;
      });
    });

    document.querySelectorAll("[data-diagram-target]").forEach(target=>{
      target.addEventListener("click",()=>{
        handleMatchAttempt(target.dataset.diagramTarget, transient.materialMatchSelected);
      });
      target.addEventListener("dragover",(e)=>e.preventDefault());
      target.addEventListener("drop",(e)=>{
        e.preventDefault();
        const selected = e.dataTransfer.getData("text/plain") || transient.materialMatchSelected;
        handleMatchAttempt(target.dataset.diagramTarget, selected);
      });
    });

    document.getElementById("resetMatchBtn")?.addEventListener("click",()=>{
      transient.materialMatchSelected = null;
      transient.materialMatched = {};
      transient.materialMatchFeedback = "";
      renderMaterial();
    });
  }

  function hotspotText(k){
    const map = {
      pusat:"<b>Titik pusat:</b> titik yang berada tepat di tengah lingkaran. Pada gambar ditandai oleh titik <b>O</b>.",
      jari:"<b>Jari-jari:</b> garis dari titik pusat <b>O</b> menuju tepi lingkaran, misalnya <b>OA</b>.",
      diameter:"<b>Diameter:</b> garis lurus yang melalui pusat <b>O</b> dan menghubungkan dua titik pada lingkaran.",
      busur:"<b>Busur:</b> bagian dari keliling lingkaran, misalnya lengkungan dari titik <b>A</b> ke <b>B</b>.",
      juring:"<b>Juring:</b> daerah yang dibatasi dua jari-jari <b>OA</b> dan <b>OB</b>, serta busur <b>AB</b>."
    };
    return map[k] || "Pilih salah satu bagian lingkaran untuk melihat penjelasannya. Bagian yang dipilih akan menyala, diberi panah animasi, dan muncul penjelasan singkat.";
  }

      },
      diameter:{
        x:22,y:44,w:128,h:54, ax1:96, ay1:95, ax2:104, ay2:147, tx:"Diameter", sx:"garis lurus melalui O"
      },
      busur:{
        x:178,y:214,w:102,h:54, ax1:225, ay1:212, ax2:218, ay2:240, tx:"Busur", sx:"bagian lengkung tepi"

      juring:{

        <div class="circle-visual">
          <svg viewBox="0 0 300 300" class="circle-svg" aria-label="Diagram unsur lingkaran">
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD166" flood-opacity="0.95"/>
            </filter>
            <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2A4675" flood-opacity="0.20"/>
            </filter>
          </defs>

          <circle class="base-circle" cx="150" cy="150" r="118"></circle>

          <!-- Juring -->
          <path class="svg-juring ${active("juring")}"
            d="M150 150 L268 150 A118 118 0 0 1 191.52 260.45 Z"></path>

          <!-- Diameter -->
          <path class="svg-diameter ${active("diameter")}" d="M32 150 L268 150"></path>

          <!-- Jari-jari OA dan OB -->
          <path class="svg-jari ${active("jari")}" d="M150 150 L268 150"></path>
          <path class="svg-jari ${active("juring")}" d="M150 150 L191.52 260.45"></path>

          <!-- Busur AB -->
          <path class="svg-busur ${active("busur")} ${active("juring")}" d="M268 150 A118 118 0 0 1 191.52 260.45"></path>

          <!-- Titik pusat -->
          <circle class="svg-pusat ${active("pusat")}" cx="150" cy="150" r="9"></circle>

          <!-- Label titik O, A, B -->
          <circle class="point-badge" cx="150" cy="132" r="13"></circle>
          <text class="point-label" x="150" y="132">O</text>

          <circle class="point-badge" cx="281" cy="150" r="13"></circle>
          <text class="point-label" x="281" y="150">A</text>

          <circle class="point-badge" cx="197" cy="278" r="13"></circle>
          <text class="point-label" x="197" y="278">B</text>

          ${callout ? `
            <line class="callout-arrow" x1="${callout.ax1}" y1="${callout.ay1}" x2="${callout.ax2}" y2="${callout.ay2}"></line>
            <circle class="callout-dot" cx="${callout.ax2}" cy="${callout.ay2}" r="6"></circle>
            <rect class="callout-bubble" x="${callout.x}" y="${callout.y}" width="${callout.w}" height="${callout.h}" rx="16" ry="16"></rect>

          ${k
            ? `Bagian <b>${({pusat:"titik pusat",jari:"jari-jari",diameter:"diameter",busur:"busur",juring:"juring"})[k]}</b> sedang di-highlight.`
            : "Klik salah satu istilah di bawah. Diagram akan menampilkan highlight, panah animasi, dan penjelas singkat."
          }
        </div>
        <div class="point-legend">
          <span class="badge">O = titik pusat</span>
          <span class="badge">A dan B = titik pada lingkaran</span>
          <span class="badge">Busur AB & Juring AOB</span>
        </div>
      </div>
    `;

      ["juring","Juring"]

                data-match-label="${key}"
                draggable="${transient.materialMatched[key] ? "false" : "true"}"

        </div>
      </section>
    `;
  }

  function renderMatchTargets(){
    const names = {
      pusat:"Titik Pusat",
      jari:"Jari-jari",
      diameter:"Diameter",
      busur:"Busur",
      juring:"Juring"
    };
    const positions = {
      pusat:"left:123px; top:123px;",
      jari:"left:206px; top:117px;",
      diameter:"left:116px; top:40px;",
      busur:"left:212px; top:208px;",
      juring:"left:100px; top:200px;"
    };
    const order = ["pusat","jari","diameter","busur","juring"];
    return order.map((key,idx) => {
      const matched = !!transient.materialMatched[key];
      return `
        <button
          class="match-target ${transient.materialMatchSelected ? "ready" : ""} ${matched ? "matched" : ""}"
          style="${positions[key]}"
          data-diagram-target="${key}"
          title="${names[key]}"
          aria-label="Target ${idx+1}: ${names[key]}"
        >
          ${matched ? names[key] : `<small>${idx+1}</small>`}
        </button>
      `;
    }).join("");
  }

  function handleMatchAttempt(targetKey, selectedKey){
    const names = {
      pusat:"Titik Pusat",
      jari:"Jari-jari",
      diameter:"Diameter",
      busur:"Busur",
      juring:"Juring"
    };
    if(!selectedKey){
      transient.materialMatchFeedback = `<div class="notice warn">Pilih atau seret dulu salah satu label unsur lingkaran.</div>`;
      renderMaterial();
      return;
    }
    if(targetKey === selectedKey){
      transient.materialMatched[targetKey] = true;
      transient.materialMatchSelected = null;
      transient.materialMatchFeedback = `<div class="notice ok">✅ Benar! <b>${names[targetKey]}</b> berhasil dicocokkan dengan gambar.</div>`;
    } else {
      transient.materialMatchFeedback = `<div class="notice bad">⚠️ Belum tepat. Kamu memilih <b>${names[selectedKey]}</b>, tetapi target ini bukan bagiannya.</div>`;
    }
    renderMaterial();
  }

  function fractionText(angle){
    if(angle===360) return "360° = satu lingkaran penuh.";
    if(angle===180) return "180° = 1/2 lingkaran.";
    if(angle===90) return "90° = 1/4 lingkaran.";
    if(angle===45) return "45° = 1/8 lingkaran.";
    return `${angle}° adalah ${fmt(angle/360*100)}% dari satu putaran penuh.`;
  }

  function bindLearningEvents(page,index){
    document.getElementById("spinBtn")?.addEventListener("click",()=>{
      const el = document.getElementById("orbitDemo");
      el.classList.remove("spin"); void el.offsetWidth; el.classList.add("spin");
    });

    document.getElementById("showStepBtn")?.addEventListener("click",()=>{
      transient.lessonStepCount++;
      renderLearning();
    });

    document.querySelectorAll(".hintBtn").forEach(b=>{
      b.addEventListener("click",()=>{
        transient.hintLevel = +b.dataset.hint;
        renderLearning();
      });
    });

    document.getElementById("checkPractice")?.addEventListener("click",()=>{
      const meta = document.getElementById("practiceMeta");
      const ans = num(document.getElementById("practiceInput").value);
      const expected = num(meta.dataset.answer);
      if(!Number.isFinite(ans)){
        transient.practiceFeedback = `<div class="notice warn">Masukkan jawaban berupa angka terlebih dahulu.</div>`;
        transient.practiceAnswered = false;
      } else if(approx(ans,expected)){
        transient.practiceFeedback = `<div class="notice ok">✅ ${meta.dataset.ok}<br><b>Planet ini selesai. Tombol LANJUT sekarang aktif.</b></div>`;
        transient.practiceAnswered = true;
        markLessonIfCompleted(index);
      } else {
        transient.practiceFeedback = `<div class="notice bad">⚠️ ${meta.dataset.bad}</div>`;
        transient.practiceAnswered = false;
      }
      renderLearning();
      updateNav();
    });

    const busurSlider = document.getElementById("busurAngleSlider");
    busurSlider?.addEventListener("input",()=>{
      transient.simAngle = +busurSlider.value;
      document.getElementById("busurAngleValue").textContent = `${transient.simAngle}°`;
      document.getElementById("busurSector").style.background = `conic-gradient(var(--blue) 0deg ${transient.simAngle}deg,#E5EDF7 ${transient.simAngle}deg 360deg)`;
      document.getElementById("busurFraction").textContent = fractionText(transient.simAngle);
    });

    const pointSlider = document.getElementById("pointSlider");
    const movingPoint = document.getElementById("movingPoint");
    if(pointSlider && movingPoint){
      const updatePoint=()=>{
        const deg = +pointSlider.value;
        const rad = deg*Math.PI/180;
        const R = 44;
        const x = 50 + R*Math.cos(rad);
        const y = 50 - R*Math.sin(rad);
        movingPoint.style.left = `calc(${x}% - 9px)`;
        movingPoint.style.top = `calc(${y}% - 9px)`;
      };
      pointSlider.addEventListener("input",updatePoint);
      updatePoint();
    }
  }

  function renderQuiz(){

      transient.evalLockNotice = true;

    }

    setHeader("Evaluasi — Ujian Komandan",`${Math.min(state.quizIndex+1,10)}/10`);
    markVisited("evaluasi");

      state.evaluationAttemptId = newUuid();

    if(state.evaluasiSelesai){
      go("hasil");
      return;
    }

    const i = Math.max(0,Math.min(state.quizIndex,quiz.length-1));
    const q = quiz[i];
    const saved = state.quizAnswers[q.id];

    content.innerHTML = `
      <div class="page">
        <h1 class="section-title">📝 Ujian Komandan</h1>
        <section class="card">

    btnNext.disabled = !isAnswered(q);

  function renderQuizInput(q,saved){
    if(q.type==="mc" || q.type==="tf"){
      return `<div class="choice-list">
        ${q.options.map((o,i)=>`<button class="choice ${saved===i?"selected":""}" data-qchoice="${i}">${o}</button>`).join("")}
      </div>`;
    }
    if(q.type==="num"){
      return `<div class="field">
        <label for="qnum">Jawaban</label>
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center">
          <input id="qnum" type="text" inputmode="decimal" placeholder="Ketik angka" value="${saved ?? ""}">
          <b>${q.unit}</b>
        </div>
      </div>`;
    }
    if(q.type==="match"){
      const obj = saved || {};
      return `<div class="match-grid">
        ${q.rows.map((r,i)=>`
          <div class="match-row">
            <b>${r[0]}</b>
            <select data-match="${i}">
              <option value="">Pilih pasangan</option>
              ${q.choices.map(c=>`<option value="${escapeHtml(c)}" ${obj[i]===c?"selected":""}>${c}</option>`).join("")}
            </select>
          </div>`).join("")}
      </div>`;
    }
    if(q.type==="order"){
      const arr = saved || ["","","",""];
      return `<div class="order-list">
        ${q.items.map((item,i)=>`
          <div class="order-row">
            <select data-order="${i}" aria-label="Urutan untuk langkah ${i+1}">
              <option value="">#</option>
              ${[1,2,3,4].map(n=>`<option value="${n}" ${String(arr[i])===String(n)?"selected":""}>${n}</option>`).join("")}
            </select>
            <div class="step">${item}</div>
          </div>`).join("")}
        <div class="tiny">Pilih angka 1–4 untuk menunjukkan urutan setiap langkah.</div>
      </div>`;
    }
    return "";
  }

  function bindQuizInput(q){
    document.querySelectorAll("[data-qchoice]").forEach(b=>{
      b.addEventListener("click",()=>{
        state.quizAnswers[q.id] = +b.dataset.qchoice;
        saveState();
        renderQuiz();
      });
    });

    document.getElementById("qnum")?.addEventListener("input",e=>{
      state.quizAnswers[q.id] = e.target.value;
      saveState();
      btnNext.disabled = !isAnswered(q);
    });

    document.querySelectorAll("[data-match]").forEach(s=>{
      s.addEventListener("change",()=>{
        const obj = {...(state.quizAnswers[q.id]||{})};
        obj[s.dataset.match] = s.value;
        state.quizAnswers[q.id] = obj;
        saveState();
        btnNext.disabled = !isAnswered(q);
      });
    });

    document.querySelectorAll("[data-order]").forEach(s=>{
      s.addEventListener("change",()=>{
        const arr = [...(state.quizAnswers[q.id]||["","","",""])];
        arr[+s.dataset.order] = s.value;
        state.quizAnswers[q.id] = arr;
        saveState();
        btnNext.disabled = !isAnswered(q);
      });
    });
  }

  function isAnswered(q){
    const a = state.quizAnswers[q.id];
    if(q.type==="mc" || q.type==="tf") return Number.isInteger(a);
    if(q.type==="num") return a !== undefined && String(a).trim() !== "" && Number.isFinite(num(a));
    if(q.type==="match") return a && q.rows.every((_,i)=>a[i]);
    if(q.type==="order"){
      return Array.isArray(a) && a.length===4 && a.every(Boolean) && new Set(a.map(String)).size===4;
    }
    return false;
  }

  function calculateScore(){
    let total = 0;

    quiz.forEach(q=>{
      const a = state.quizAnswers[q.id];
      if(q.type==="mc" || q.type==="tf"){
        if(a===q.answer) total += 10;
      } else if(q.type==="num"){
        if(approx(num(a),q.answer)) total += 10;
      } else if(q.type==="match"){
        let right=0;
        q.rows.forEach((r,i)=>{ if(a && a[i]===r[1]) right++; });
        total += (right/q.rows.length)*10;
      } else if(q.type==="order"){
        let right=0;
        if(Array.isArray(a)){
          // each item should have the number matching its natural position (1..4)
          a.forEach((v,i)=>{ if(String(v)===String(i+1)) right++; });
        }
        total += (right/4)*10;
      }
    });

    state.nilaiAkhir = Math.round(total);
    state.kategoriHasil =
      state.nilaiAkhir >= 86 ? "Sangat Baik" :
      state.nilaiAkhir >= 76 ? "Baik" :
      state.nilaiAkhir >= 66 ? "Cukup" : "Perlu Latihan";
    state.evaluasiSelesai = true;
    saveState();
    syncEvaluationResult().catch(err => {
      console.error("Gagal menyimpan hasil evaluasi ke Supabase:", err);
      setCloudStatus("error");
    });
  }

  // ===============================
  // RESULT / REVIEW
  // ===============================
  function renderResult(){
    setHeader("Hasil Misi","Evaluasi selesai");
    const stars = state.nilaiAkhir>=86 ? "⭐⭐⭐⭐⭐" : state.nilaiAkhir>=76 ? "⭐⭐⭐⭐" : state.nilaiAkhir>=66 ? "⭐⭐⭐" : "⭐⭐";
    content.innerHTML = `
      <div class="page">
        <h1 class="section-title">🏁 Hasil Misi</h1>
        <section class="card">
          <div class="result-score">${state.nilaiAkhir}</div>
          <div class="result-cat">${state.kategoriHasil}</div>
          <div style="text-align:center;font-size:28px;margin-bottom:14px">${stars}</div>

          <div class="stat-grid">
            <div class="stat"><small>Nama</small><strong style="font-size:18px">${escapeHtml(state.namaSiswa)}</strong></div>
            <div class="stat"><small>Kelas</small><strong>${escapeHtml(state.kelasSiswa)}</strong></div>
          </div>

          <div class="notice info">
            Nilai dan progres disimpan di <b>localStorage</b> sebagai cache offline dan akan disinkronkan ke <b>Supabase</b> saat koneksi tersedia.
            ${state.evaluationSyncedAt ? `<br><b>✅ Hasil evaluasi sudah tersinkron ke Supabase.</b>` : `<br><b>⏳ Hasil evaluasi menunggu sinkronisasi.</b>`}
          </div>

          <div class="inline-actions" style="margin-top:14px">
            <button id="reviewBtn" class="btn primary">LIHAT PEMBAHASAN</button>
            <button id="retryBtn" class="btn yellow">ULANGI EVALUASI</button>
          </div>
        </section>

        <section class="card">
          <h3 class="card-title">Penyimpanan Cloud</h3>
          <p class="subtle">Aplikasi memakai Supabase Anonymous Auth. Selama sesi anonim pada browser ini masih tersimpan, progres dapat dimuat kembali dari cloud. Menghapus data situs/browser dapat menghapus identitas anonim lokal; gunakan perangkat/browser yang sama untuk melanjutkan sesi yang sama.</p>
          <button id="syncNowBtn" class="btn ghost block">☁️ SINKRONKAN SEKARANG</button>
          <div id="syncNowFeedback"></div>
        </section>
      </div>
    `;

    document.getElementById("reviewBtn").addEventListener("click",()=>go("pembahasan",0));
    document.getElementById("retryBtn").addEventListener("click",()=>{
      if(confirm("Ulangi evaluasi dari awal? Nama, kelas, dan progres materi tetap dipertahankan.")){
        state.quizAnswers = {};
        state.quizIndex = 0;
        state.evaluasiSelesai = false;
        state.nilaiAkhir = 0;
        state.kategoriHasil = "";
        state.evaluationAttemptId = newUuid();
        state.evaluationSyncedAt = null;
        saveState();
        go("evaluasi",0);
      }
    });
    document.getElementById("syncNowBtn")?.addEventListener("click", async ()=>{
      const fb = document.getElementById("syncNowFeedback");
      if(!navigator.onLine){
        fb.innerHTML = `<div class="notice warn">Perangkat sedang offline. Data tetap aman di cache lokal dan akan dicoba lagi saat online.</div>`;
        return;
      }
      try{
        fb.innerHTML = `<div class="notice info">Menyinkronkan data…</div>`;
        await pushCloudState(true);
        await syncEvaluationResult();
        fb.innerHTML = `<div class="notice ok">✅ Data berhasil disinkronkan ke Supabase.</div>`;
        renderResult();
      }catch(err){
        console.error(err);
        fb.innerHTML = `<div class="notice bad">⚠️ Sinkronisasi gagal. Periksa konfigurasi Supabase atau koneksi internet.</div>`;
      }
    });
  }

  function renderReview(){
    setHeader("Pembahasan Evaluasi","10 soal");
    content.innerHTML = `
      <div class="page">
        <h1 class="section-title">📘 Pembahasan Evaluasi</h1>
        <p class="section-sub">Bandingkan jawabanmu dengan konsep yang benar.</p>
        ${quiz.map((q,i)=>{
          const ok = answerCorrect(q);
          return `
            <section class="review-item">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
                <b style="color:var(--navy)">Soal ${i+1} — ${q.title}</b>
                <span class="badge ${ok?"done":""}">${ok?"✅ Tepat":"⚠️ Perlu diperbaiki"}</span>
              </div>
              <p>${q.q}</p>
              <div class="notice ${ok?"ok":"bad"}">${ok ? q.correct : q.wrong}</div>
            </section>
          `;
        }).join("")}
      </div>
    `;
  }

  function answerCorrect(q){
    const a = state.quizAnswers[q.id];
    if(q.type==="mc" || q.type==="tf") return a===q.answer;
    if(q.type==="num") return approx(num(a),q.answer);
    if(q.type==="match") return q.rows.every((r,i)=>a && a[i]===r[1]);
    if(q.type==="order") return Array.isArray(a) && a.every((v,i)=>String(v)===String(i+1));
    return false;
  }

  // ===============================
  // SIMULATION / GAMES
  // ===============================
  function renderSimulation(){
    setHeader("Simulator Orbit","Eksperimen");
    markVisited("simulasi");
    content.innerHTML = `
      <div class="page">
        <h1 class="section-title">🎮 Simulator & Games</h1>
        <p class="section-sub">Aktivitas ini tidak memengaruhi nilai evaluasi.</p>

        <section class="card">
          <h2 class="card-title">Game 1 — Simulator Orbit</h2>
          <p class="subtle">Geser jari-jari. Gunakan π = 3,14.</p>
          <div class="slider-row">
            <input id="radiusSlider" type="range" min="1" max="20" value="${transient.simRadius}">
            <b id="radiusValue">r = ${transient.simRadius}</b>
          </div>
          <div id="simCircle" class="circle-diagram" style="width:${120+transient.simRadius*7}px;max-width:78vw"></div>
          <div class="stat-grid">
            <div class="stat"><small>Diameter</small><strong id="simD">${fmt(transient.simRadius*2)}</strong></div>
            <div class="stat"><small>Keliling</small><strong id="simK">${fmt(2*3.14*transient.simRadius)}</strong></div>
            <div class="stat"><small>Luas</small><strong id="simL">${fmt(3.14*transient.simRadius*transient.simRadius)}</strong></div>
            <div class="stat"><small>Jari-jari</small><strong id="simR">${fmt(transient.simRadius)}</strong></div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">Game 2 — Pengendali Busur</h2>
          <p class="subtle">r = 14 cm · π = 22/7</p>
          <div class="slider-row">
            <input id="gameAngle" type="range" min="0" max="360" step="10" value="${transient.simAngle}">
            <b id="gameAngleVal">${transient.simAngle}°</b>
          </div>
          <div id="gameSector" class="sector" style="margin:12px auto;background:conic-gradient(var(--blue) 0deg ${transient.simAngle}deg,#E5EDF7 ${transient.simAngle}deg 360deg)"></div>
          <div class="notice info" id="arcCalc">Panjang busur = ${fmt((transient.simAngle/360)*88)} cm</div>
        </section>

        <section class="card">
          <h2 class="card-title">Game 3 — Bangun Juring Planet</h2>
          <div class="hotspots">
            ${[45,90,120,180,270].map(a=>`<button class="hotspot-btn ${a===transient.sectorAngle?"active":""}" data-sector="${a}">${a}°</button>`).join("")}
          </div>
          <div id="sectorGame" class="sector" style="margin:14px auto;background:conic-gradient(var(--yellow) 0deg ${transient.sectorAngle}deg,#DDEBFA ${transient.sectorAngle}deg 360deg)"></div>
          <p><b>Apakah juring ini kurang dari setengah, tepat setengah, atau lebih dari setengah lingkaran?</b></p>
          <div class="choice-list" id="sectorPred">
            <button class="choice" data-pred="kurang">Kurang dari setengah</button>
            <button class="choice" data-pred="tepat">Tepat setengah</button>
            <button class="choice" data-pred="lebih">Lebih dari setengah</button>
          </div>
          <div id="sectorFeedback"></div>
        </section>

        <section class="card">
          <h2 class="card-title">Game 4 — Isi Bahan Bakar Roket</h2>
          <div class="fuel"><div id="fuelBar" style="width:${transient.fuel}%"></div></div>
          <p style="text-align:center"><b id="fuelText">${transient.fuel}% bahan bakar</b></p>
          <div id="fuelQuestion">${renderFuelQuestion()}</div>
        </section>
      </div>
    `;

    bindSimulation();
  }

  function bindSimulation(){
    const rs = document.getElementById("radiusSlider");
    rs.addEventListener("input",()=>{
      transient.simRadius = +rs.value;
      document.getElementById("radiusValue").textContent = `r = ${transient.simRadius}`;
      document.getElementById("simR").textContent = fmt(transient.simRadius);
      document.getElementById("simD").textContent = fmt(transient.simRadius*2);
      document.getElementById("simK").textContent = fmt(2*3.14*transient.simRadius);
      document.getElementById("simL").textContent = fmt(3.14*transient.simRadius*transient.simRadius);
      document.getElementById("simCircle").style.width = `${120+transient.simRadius*7}px`;
    });

    const ga = document.getElementById("gameAngle");
    ga.addEventListener("input",()=>{
      transient.simAngle = +ga.value;
      document.getElementById("gameAngleVal").textContent = `${transient.simAngle}°`;
      document.getElementById("gameSector").style.background = `conic-gradient(var(--blue) 0deg ${transient.simAngle}deg,#E5EDF7 ${transient.simAngle}deg 360deg)`;
      document.getElementById("arcCalc").textContent = `Panjang busur = ${fmt((transient.simAngle/360)*88)} cm`;
    });

    document.querySelectorAll("[data-sector]").forEach(b=>{
      b.addEventListener("click",()=>{
        transient.sectorAngle = +b.dataset.sector;
        renderSimulation();
      });
    });

    document.querySelectorAll("[data-pred]").forEach(b=>{
      b.addEventListener("click",()=>{
        const expected = transient.sectorAngle<180?"kurang":transient.sectorAngle===180?"tepat":"lebih";
        const ok = b.dataset.pred===expected;
        document.getElementById("sectorFeedback").innerHTML = ok
          ? `<div class="notice ok">✅ Tepat. ${transient.sectorAngle}° ${expected==="kurang"?"kurang dari":expected==="tepat"?"sama dengan":"lebih dari"} 180°.</div>`
          : `<div class="notice bad">⚠️ Bandingkan ${transient.sectorAngle}° dengan 180°. Setengah lingkaran adalah 180°.</div>`;
      });
    });

    const fuelBox = document.getElementById("fuelQuestion");
    fuelBox.addEventListener("click", (e)=>{
      const b = e.target.closest("[data-fuel]");
      if(!b) return;
      const isCorrect = b.dataset.fuel==="1";
      if(isCorrect){
        transient.fuel = Math.min(100,transient.fuel+20);
        transient.fuelIndex = Math.min(4,transient.fuelIndex+1);
        document.getElementById("fuelBar").style.width = `${transient.fuel}%`;
        document.getElementById("fuelText").textContent = `${transient.fuel}% bahan bakar`;
        fuelBox.innerHTML = transient.fuel>=100
          ? `<div class="notice ok">🚀 Roket siap menjelajah! Bahan bakar 100%.</div><button id="fuelReset" class="btn ghost block" style="margin-top:10px">MAIN LAGI</button>`
          : `<div class="notice ok">✅ Benar! +20% bahan bakar.</div>${renderFuelQuestion()}`;
        document.getElementById("fuelReset")?.addEventListener("click",()=>{
          transient.fuel=0; transient.fuelIndex=0; renderSimulation();
        });
      }else{
        fuelBox.querySelector(".notice.bad")?.remove();
        fuelBox.insertAdjacentHTML("afterbegin",`<div class="notice bad">⚠️ Belum tepat. Coba lagi tanpa kehilangan bahan bakar.</div>`);
      }
    });
  }

  function renderFuelQuestion(){
    const items = [
      {q:"Jika r = 7 cm, berapa diameter?",opts:[["14 cm",1],["7 cm",0],["21 cm",0]]},
      {q:"Rumus luas lingkaran adalah ...",opts:[["πr²",1],["2πr",0],["πd",0]]},
      {q:"90° adalah berapa bagian dari 360°?",opts:[["1/4",1],["1/2",0],["1/3",0]]},
      {q:"Sudut keliling yang menghadap diameter besarnya ...",opts:[["90°",1],["180°",0],["45°",0]]},
      {q:"Juring adalah bagian dari ...",opts:[["luas lingkaran",1],["diameter",0],["jari-jari",0]]}
    ];
    const item = items[transient.fuelIndex] || items[0];
    return `
      <p><b>${item.q}</b></p>
      <div class="choice-list">
        ${item.opts.map(o=>`<button class="choice" data-fuel="${o[1]}">${o[0]}</button>`).join("")}
      </div>`;
  }

  // ===============================
  // NAVIGATION
  // ===============================
  function updateNav(){
    if(bottomNav.classList.contains("hidden")) return;

    btnMenu.disabled = state.screen==="menu";

    let backDisabled = false;
    let nextDisabled = false;
    let nextText = "LANJUT →";

    if(state.screen==="menu"){
      backDisabled = true;
      nextDisabled = true;
    } else if(state.screen==="tujuan"){
      backDisabled = false;
      nextDisabled = false;
    } else if(state.screen==="materi"){
      backDisabled = state.sub<=0;
      nextDisabled = state.sub>=materialPages.length-1;
    } else if(state.screen==="belajar"){
      backDisabled = state.sub<=0;
      nextDisabled = state.sub>=learningPages.length-1;
      // For final practice pages, encourage completion before next
      const p = learningPages[state.sub];
      if(p && p.type.endsWith("latihan") && !state.materiSelesai[p.key]){
        nextDisabled = true;
      }
    } else if(state.screen==="evaluasi"){
      backDisabled = state.quizIndex<=0;
      const q = quiz[state.quizIndex];
      nextDisabled = !isAnswered(q);
      nextText = state.quizIndex===quiz.length-1 ? "SELESAI →" : "LANJUT →";
    } else if(state.screen==="hasil" || state.screen==="pembahasan" || state.screen==="simulasi"){
      nextDisabled = true;
      backDisabled = false;
    }

    btnBack.disabled = backDisabled;
    btnNext.disabled = nextDisabled;
    btnNext.textContent = nextText;
  }

  btnMenu.addEventListener("click",()=>go("menu"));

  btnBack.addEventListener("click",()=>{
    if(state.screen==="tujuan") return go("menu");
    if(state.screen==="materi") return state.sub>0 ? go("materi",state.sub-1) : go("menu");
    if(state.screen==="belajar"){
      transient.lessonStepCount=0; transient.practiceFeedback=""; transient.practiceAnswered=false; transient.hintLevel=0;
      return state.sub>0 ? go("belajar",state.sub-1) : go("menu");
    }
    if(state.screen==="evaluasi"){
      if(state.quizIndex>0){ state.quizIndex--; saveState(); render(); } else go("menu");
      return;
    }
    if(state.screen==="hasil") return go("menu");
    if(state.screen==="pembahasan") return go("hasil");
    if(state.screen==="simulasi") return go("menu");
  });

  btnNext.addEventListener("click",()=>{
    if(state.screen==="tujuan") return go("materi",0);

    if(state.screen==="materi"){
      if(state.sub<materialPages.length-1) return go("materi",state.sub+1);
      return;
    }

    if(state.screen==="belajar"){
      if(state.sub<learningPages.length-1){
        markLessonIfCompleted(state.sub);
        transient.lessonStepCount=0;
        transient.practiceFeedback="";
        transient.practiceAnswered=false;
        transient.hintLevel=0;
        return go("belajar",state.sub+1);
      }
      return;
    }

    if(state.screen==="evaluasi"){
      const q = quiz[state.quizIndex];
      if(!isAnswered(q)) return;
      if(state.quizIndex < quiz.length-1){
        state.quizIndex++;
        saveState();
        render();
      }else{
        if(confirm("Semua soal telah dijawab. Selesaikan evaluasi dan hitung nilai?")){
          calculateScore();
          go("hasil");
        }
      }
    }
  });

  // Initial route
  if(state.identitasValid && state.screen==="pembuka"){
    // tetap izinkan pembuka jika pengguna sedang di sana
  }
  render();
  initSupabase();
})();
</script>
</body>
</html>
